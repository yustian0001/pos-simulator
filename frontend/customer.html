<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Customer Display</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{height:100vh;overflow:hidden;background:#0f172a;display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 20px rgba(59,130,246,.3)}50%{box-shadow:0 0 40px rgba(59,130,246,.6)}}
@keyframes marquee{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.slide-in{animation:slideIn .3s ease-out}
.pulse-glow{animation:pulseGlow 2s infinite}
.marquee{animation:marquee 20s linear infinite}
/* LEFT: Iklan (70%) */
.left{width:70%;display:flex;flex-direction:column;background:linear-gradient(135deg,#1e3a8a,#312e81,#581c87)}
/* RIGHT: Transaksi (30%) */
.right{width:30%;display:flex;flex-direction:column;background:linear-gradient(to bottom,#0f172a,#1e293b);border-left:1px solid #334155}
.r-header{background:rgba(30,41,59,.8);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155}
.r-header h2{font-size:14px;font-weight:700;color:#fff}
.r-clock{font-size:14px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.r-status{padding:8px 16px;font-size:11px;display:flex;align-items:center;gap:6px}
.r-status .dot{width:6px;height:6px;border-radius:50%}
.r-items{flex:1;overflow-y:auto;padding:8px 12px}
.r-items::-webkit-scrollbar{width:3px}
.r-items::-webkit-scrollbar-thumb{background:#475569;border-radius:2px}
.r-total{background:rgba(30,41,59,.8);padding:12px 16px;border-top:1px solid #334155}
.r-total-label{color:#94a3b8;font-size:10px}
.r-total-amount{font-size:24px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.r-total-sub{font-size:11px;color:#94a3b8;margin-top:2px}
/* Ad area */
.ad-area{flex:1;display:flex;align-items:center;justify-content:center;padding:32px}
.ad-content{text-align:center;max-width:500px}
.ad-icon{width:80px;height:80px;background:rgba(255,255,255,.1);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:40px}
.ad-title{font-size:28px;font-weight:900;color:#fff;margin-bottom:8px}
.ad-desc{color:#bfdbfe;font-size:14px;margin-bottom:20px}
.ad-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.ad-card{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border-radius:14px;padding:14px;border:1px solid rgba(255,255,255,.2)}
.ad-card .emoji{font-size:22px;margin-bottom:2px}
.ad-card .name{color:#fff;font-weight:700;font-size:13px}
.ad-card .price{color:#facc15;font-weight:700;font-size:13px}
.ad-card .old{color:#94a3b8;font-size:11px;text-decoration:line-through}
.marquee-bar{overflow:hidden;background:rgba(255,255,255,.05);border-radius:8px;padding:6px 12px}
.marquee-text{color:#93c5fd;font-size:11px;white-space:nowrap}
.item-row{background:rgba(51,65,85,.5);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(71,85,105,.5);margin-bottom:4px;font-size:11px}
.item-num{width:20px;height:20px;background:#2563eb;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:10px;flex-shrink:0}
.item-info{flex:1;margin-left:6px}
.item-name{color:#fff;font-weight:600;font-size:11px}
.item-qty{color:#94a3b8;font-size:9px}
.item-price{color:#fff;font-weight:700;font-variant-numeric:tabular-nums;font-size:11px}
.footer{text-align:center;padding:6px;border-top:1px solid rgba(255,255,255,.1)}
.footer p{color:rgba(147,197,253,.3);font-size:10px}
</style>
</head>
<body>
<!-- LEFT: Iklan (70%) -->
<div class="left">
  <div class="ad-area">
    <div class="ad-content">
      <div class="ad-icon pulse-glow" id="ad-icon">🛍️</div>
      <h2 class="ad-title" id="ad-title">Promo Spesial Hari Ini!</h2>
      <p class="ad-desc" id="ad-desc">Dapatkan diskon menarik untuk semua produk pilihan</p>
      <div class="ad-grid" id="promo-cards"></div>
      <div class="marquee-bar"><p class="marquee-text marquee" id="ad-marquee">🎉 Promo Spesial! 🎉</p></div>
    </div>
  </div>
  <div class="footer"><p>POS Simulator v2.2</p></div>
</div>

<!-- RIGHT: Transaksi (30%) -->
<div class="right">
  <div class="r-header">
    <h2>🛒 Belanjaan</h2>
    <div class="r-clock" id="clock">--:--</div>
  </div>
  <div class="r-status" id="r-status">
    <div class="dot" style="background:#22c55e"></div>
    <span style="color:#4ade80;font-weight:600" id="status-text">Menunggu...</span>
  </div>
  <div class="r-items" id="items-list">
    <div style="text-align:center;padding:40px 0"><p style="color:#475569;font-size:12px">Menunggu transaksi...</p></div>
  </div>
  <div class="r-total">
    <div class="r-total-label">Total</div>
    <div class="r-total-amount" id="grand-total">Rp 0</div>
    <div class="r-total-sub" id="payment-info"></div>
  </div>
</div>

<script>
// Clock
function updateClock(){const n=new Date();document.getElementById("clock").textContent=n.toLocaleTimeString("id-ID",{hour12:false})}
setInterval(updateClock,1000);updateClock();

// Load ads from settings
async function loadAds(){
  try{
    var r=await fetch("/api/settings");var s=await r.json();
    if(s.ad_title)document.getElementById("ad-title").textContent=s.ad_title;
    if(s.ad_desc)document.getElementById("ad-desc").textContent=s.ad_desc;
    if(s.ad_marquee)document.getElementById("ad-marquee").textContent=s.ad_marquee;
    if(s.ad_cards){
      var cards=JSON.parse(s.ad_cards);
      var grid="";
      cards.forEach(function(c){
        grid+='<div class="ad-card"><p class="emoji">'+c.emoji+'</p><p class="name">'+c.name+'</p><p class="price">Rp '+parseInt(c.price).toLocaleString("id-ID")+'</p>';
        if(c.old_price)grid+='<p class="old">Rp '+parseInt(c.old_price).toLocaleString("id-ID")+'</p>';
        grid+='</div>';
      });
      document.getElementById("promo-cards").innerHTML=grid;
    }
  }catch(e){}
}
loadAds();

// WebSocket
var liveItems=[];
var WS_URL="ws://"+location.host+"/ws";
function connectWS(){
  try{
    var ws=new WebSocket(WS_URL);
    ws.onopen=function(){
      document.getElementById("status-text").textContent="Terhubung";
      document.getElementById("status-text").style.color="#4ade80";
      document.querySelector("#r-status .dot").style.background="#22c55e";
    };
    ws.onmessage=function(e){
      var msg=JSON.parse(e.data);
      if(msg.type==="cart_update")handleCartUpdate(msg.data);
      if(msg.type==="new_transaction")handleNewTx(msg.data);
    };
    ws.onclose=function(){
      document.getElementById("status-text").textContent="Disconnected...";
      document.getElementById("status-text").style.color="#dc2626";
      document.querySelector("#r-status .dot").style.background="#dc2626";
      setTimeout(connectWS,3000);
    };
    ws.onerror=function(){};
  }catch(e){}
}

// Live cart update dari kasir
function handleCartUpdate(data){
  liveItems=data.items||[];
  var total=data.total||0;
  renderLiveItems();
  // Update total
  document.getElementById("grand-total").textContent="Rp "+total.toLocaleString("id-ID");
  document.getElementById("payment-info").textContent=""+liveItems.length+" item";
  // Status
  document.getElementById("status-text").textContent="Memilih produk...";
  document.getElementById("status-text").style.color="#fbbf24";
  document.querySelector("#r-status .dot").style.background="#fbbf24";
}

function renderLiveItems(){
  var el=document.getElementById("items-list");
  if(!liveItems.length){
    el.innerHTML='<div style="text-align:center;padding:40px 0"><p style="color:#475569;font-size:12px">Menunggu transaksi...</p></div>';
    return;
  }
  var html="";
  liveItems.forEach(function(item,i){
    html+='<div class="item-row slide-in" style="animation-delay:'+i*50+'ms">';
    html+='<div class="item-num">'+(i+1)+'</div>';
    html+='<div class="item-info"><p class="item-name">'+item.name+'</p><p class="item-qty">'+item.qty+' x Rp '+item.price.toLocaleString("id-ID")+'</p></div>';
    html+='<p class="item-price">Rp '+(item.price*item.qty).toLocaleString("id-ID")+'</p>';
    html+='</div>';
  });
  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
}

// Checkout selesai — final transaction
function handleNewTx(tx){
  // Tampilkan item + total final
  liveItems=(tx.items||[]).map(function(it){return{name:it.name,qty:it.qty,price:it.price}});
  renderLiveItems();
  document.getElementById("grand-total").textContent="Rp "+(tx.grand_total||0).toLocaleString("id-ID");
  document.getElementById("payment-info").textContent="✅ "+(tx.payment||"CASH");
  // Status biru
  document.getElementById("status-text").textContent="Transaksi selesai!";
  document.getElementById("status-text").style.color="#60a5fa";
  document.querySelector("#r-status .dot").style.background="#60a5fa";
  // Reset setelah 8 detik
  setTimeout(function(){
    liveItems=[];
    document.getElementById("items-list").innerHTML='<div style="text-align:center;padding:40px 0"><p style="color:#475569;font-size:12px">Menunggu transaksi...</p></div>';
    document.getElementById("grand-total").textContent="Rp 0";
    document.getElementById("payment-info").textContent="";
    document.getElementById("status-text").textContent="Menunggu...";
    document.getElementById("status-text").style.color="#4ade80";
    document.querySelector("#r-status .dot").style.background="#22c55e";
  },8000);
}

connectWS();
</script>
</body>
</html>
