<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Customer Display</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
html,body{width:100%;height:100vh;overflow:hidden}
body{display:flex;background:#1a0a0a}
@media(max-width:1024px){
  .left{width:60%}
  .right{width:40%}
  .r-total-amount{font-size:24px}
  .ad-carousel-wrap{padding:16px 16px 0}
}
@media(max-width:768px){
  body{flex-direction:column;height:auto;overflow-y:auto}
  .left{width:100%;min-height:450px}
  .right{width:100%;min-height:450px;border-left:none;border-top:2px solid rgba(212,175,55,.3)}
}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 20px rgba(212,175,55,.3)}50%{box-shadow:0 0 40px rgba(212,175,55,.6)}}
@keyframes marquee{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.slide-in{animation:slideIn .3s ease-out}
.pulse-glow{animation:pulseGlow 2s infinite}
.marquee{animation:marquee 25s linear infinite}
/* LEFT: Iklan (70%) */
.left{width:70%;display:flex;flex-direction:column;background:linear-gradient(135deg,#8B0015 0%,#a5001a 30%,#c41230 60%,#d4243a 100%);position:relative;overflow:hidden}
.left::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(212,175,55,.15) 0%,transparent 60%);pointer-events:none}
.left::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 70% 80%,rgba(212,175,55,.1) 0%,transparent 50%);pointer-events:none}
/* Ad image area (16:9) */
.ad-carousel-wrap{flex:1;display:flex;flex-direction:column;padding:24px 32px 0;position:relative;z-index:1}
.ad-carousel{flex:1;border:2px solid rgba(212,175,55,.3);border-radius:16px;overflow:hidden;background:rgba(0,0,0,.3);position:relative}
.ad-carousel img{width:100%;height:100%;object-fit:contain;animation:fadeIn .5s ease-out}
.ad-carousel .ad-fallback{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fde68a}
.ad-carousel .ad-fallback .icon{font-size:64px;margin-bottom:12px}
.ad-carousel .ad-fallback h2{font-size:32px;font-weight:900;color:#fef3c7;margin-bottom:8px}
.ad-carousel .ad-fallback p{font-size:16px;opacity:.8}
.ad-dots{display:flex;justify-content:center;gap:8px;padding:8px}
.ad-dot{width:10px;height:10px;border-radius:50%;background:rgba(212,175,55,.3);cursor:pointer;transition:background .2s}
.ad-dot.active{background:#D4AF37}
/* Running text bar */
.ad-marquee-wrap{border:2px solid rgba(212,175,55,.3);border-radius:12px;padding:10px 16px;margin:12px 32px 20px;background:rgba(212,175,55,.08);overflow:hidden;position:relative;z-index:1}
.ad-marquee-text{color:#fde68a;font-size:15px;font-weight:600;white-space:nowrap}
.footer{position:relative;z-index:1;text-align:center;padding:8px;border-top:1px solid rgba(212,175,55,.15)}
.footer p{color:rgba(253,230,138,.3);font-size:11px}
/* RIGHT: Transaksi (30%) */
.right{width:30%;display:flex;flex-direction:column;background:linear-gradient(to bottom,#1c1917,#292524);border-left:2px solid rgba(212,175,55,.3)}
.r-header{background:rgba(28,25,23,.9);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(212,175,55,.2)}
.r-header h2{font-size:16px;font-weight:700;color:#fef3c7}
.r-clock{font-size:16px;font-weight:700;color:#D4AF37;font-variant-numeric:tabular-nums}
.r-status{padding:10px 20px;font-size:12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.05)}
.r-status .dot{width:8px;height:8px;border-radius:50%}
.r-items{flex:1;overflow-y:auto;padding:12px 16px}
.r-items::-webkit-scrollbar{width:3px}
.r-items::-webkit-scrollbar-thumb{background:#78716c;border-radius:2px}
.r-total{background:rgba(28,25,23,.9);padding:16px 20px;border-top:2px solid rgba(212,175,55,.3)}
.r-total-label{color:#a8a29e;font-size:12px}
.r-total-amount{font-size:32px;font-weight:900;color:#D4AF37;font-variant-numeric:tabular-nums}
.r-total-sub{font-size:12px;color:#a8a29e;margin-top:4px}
.item-row{background:rgba(41,37,36,.8);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(120,113,108,.3);margin-bottom:6px}
.item-num{width:24px;height:24px;background:linear-gradient(135deg,#8B0015,#a5001a);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#D4AF37;font-weight:700;font-size:11px;flex-shrink:0}
.item-info{flex:1;margin-left:10px}
.item-name{color:#fef3c7;font-weight:600;font-size:13px}
.item-qty{color:#a8a29e;font-size:11px}
.item-price{color:#D4AF37;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
</style>
</head>
<body>
<!-- LEFT: Iklan (70%) -->
<div class="left">
  <div class="ad-carousel-wrap">
    <!-- Carousel 16:9 -->
    <div class="ad-carousel" id="ad-carousel">
      <div class="ad-fallback" id="ad-fallback">
        <div class="icon pulse-glow">🛍️</div>
        <h2 id="ad-title">Promo Spesial Hari Ini!</h2>
        <p id="ad-desc">Dapatkan diskon menarik untuk semua produk pilihan</p>
      </div>
    </div>
    <div class="ad-dots" id="ad-dots"></div>
  </div>
  <!-- Running Text -->
  <div class="ad-marquee-wrap">
    <p class="ad-marquee-text marquee" id="ad-marquee">🎉 Promo Spesial! 🎉</p>
  </div>
  <div class="footer"><p>POS Simulator v2.2</p></div>
</div>

<!-- RIGHT: Transaksi (30%) -->
<div class="right">
  <div class="r-header" style="flex-direction:column;gap:4px;padding:12px 16px">
    <div style="display:flex;justify-content:space-between;align-items:center;width:100%">
      <h2 style="font-size:14px;font-weight:700;color:#fef3c7" id="store-name-header">🛒 Belanjaan</h2>
      <div class="r-clock" id="clock">--:--</div>
    </div>
    <div style="display:flex;justify-content:space-between;width:100%;font-size:11px">
      <span style="color:#D4AF37" id="kasir-display">Kasir: --</span>
      <span style="color:#a8a29e" id="member-display"></span>
    </div>
  </div>
  <div class="r-status" id="r-status">
    <div class="dot" style="background:#22c55e"></div>
    <span style="color:#4ade80;font-weight:600" id="status-text">Menunggu...</span>
  </div>
  <div class="r-items" id="items-list">
    <div style="text-align:center;padding:60px 0"><p style="color:#78716c;font-size:14px">Menunggu transaksi...</p></div>
  </div>
  <div class="r-total">
    <div class="r-total-label">Total Belanja</div>
    <div class="r-total-amount" id="grand-total">Rp 0</div>
    <div id="payment-details" style="display:none;margin-top:10px;padding-top:8px;border-top:1px dashed rgba(212,175,55,.3)">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:#d6d3d1;margin-bottom:4px">
        <span>Tunai / Bayar:</span>
        <span id="cash-paid-display" style="font-weight:700;color:#fff">Rp 0</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:18px;color:#4ade80;font-weight:800">
        <span>Kembali:</span>
        <span id="change-display">Rp 0</span>
      </div>
    </div>
    <div class="r-total-sub" id="payment-info" style="margin-top:6px"></div>
  </div>
</div>

<script>
// Clock
function updateClock(){var n=new Date();document.getElementById("clock").textContent=n.toLocaleTimeString("id-ID",{hour12:false})}
setInterval(updateClock,1000);updateClock();

// Carousel state
var _adImages=[];
var _adIdx=0;
var _carouselTimer=null;

// Load ads + images from settings
async function loadAds(){
  try{
    var r=await fetch("/api/settings");var s=await r.json();
    if(s.ad_title)document.getElementById("ad-title").textContent=s.ad_title;
    if(s.ad_desc)document.getElementById("ad-desc").textContent=s.ad_desc;
    if(s.ad_marquee)document.getElementById("ad-marquee").textContent=s.ad_marquee;
    // Load images
    _adImages=JSON.parse(s.ad_images||"[]");
    renderCarousel();
  }catch(e){}
}
function renderCarousel(){
  var el=document.getElementById("ad-carousel");
  var dots=document.getElementById("ad-dots");
  if(!_adImages.length){
    // Show fallback (no images uploaded)
    el.innerHTML='<div class="ad-fallback" id="ad-fallback"><div class="icon pulse-glow">🛍️</div><h2 id="ad-title">Promo Spesial Hari Ini!</h2><p id="ad-desc">Dapatkan diskon menarik untuk semua produk pilihan</p></div>';
    dots.innerHTML='';
    if(_carouselTimer)clearInterval(_carouselTimer);
    return;
  }
  // Show image carousel
  el.innerHTML='<img src="'+_adImages[_adIdx]+'" alt="Iklan">';
  dots.innerHTML=_adImages.map(function(_,i){
    return '<div class="ad-dot'+(i===_adIdx?' active':'')+'" onclick="goSlide('+i+')"></div>';
  }).join("");
  // Auto-rotate
  if(_adImages.length>1){
    if(_carouselTimer)clearInterval(_carouselTimer);
    _carouselTimer=setInterval(function(){_adIdx=(_adIdx+1)%_adImages.length;renderCarousel()},4000);
  }
}
function goSlide(i){_adIdx=i;renderCarousel()}
loadAds();
async function loadStoreName(){try{var r=await fetch("/api/settings");var s=await r.json();if(s.store_name)document.getElementById("store-name-header").textContent="🛒 "+s.store_name;}catch(e){}}
loadStoreName();

// WebSocket
var liveItems=[];
var isCheckoutDone=false;
var WS_URL="ws://"+location.host+"/ws";
function connectWS(){
  try{
    var ws=new WebSocket(WS_URL);
    ws.onopen=function(){
      document.getElementById("status-text").textContent="Terhubung";
      document.getElementById("status-text").style.color="#4ade80";
      document.querySelector("#r-status .dot").style.background="#22c55e";
    };
    ws.onmessage=function(e){
      var msg=JSON.parse(e.data);
      if(msg.type==="cart_update")handleCartUpdate(msg.data);
      if(msg.type==="new_transaction")handleNewTx(msg.data);
      if(msg.type==="reset_display"){isCheckoutDone=false;closeTransaction();}
    };
    ws.onclose=function(){
      document.getElementById("status-text").textContent="Disconnected...";
      document.getElementById("status-text").style.color="#dc2626";
      document.querySelector("#r-status .dot").style.background="#dc2626";
      setTimeout(connectWS,3000);
    };
    ws.onerror=function(){};
  }catch(e){}
}

function handleCartUpdate(data){
  if(isCheckoutDone)return;
  liveItems=data.items||[];
  var total=data.total||0;
  renderLiveItems();
  document.getElementById("payment-details").style.display="none";
  document.getElementById("grand-total").textContent="Rp "+total.toLocaleString("id-ID");
  document.getElementById("payment-info").textContent=liveItems.length+" item dipilih";
  document.getElementById("status-text").textContent="Memilih produk...";
  document.getElementById("status-text").style.color="#fbbf24";
  document.querySelector("#r-status .dot").style.background="#fbbf24";
  if(data.cashier)document.getElementById("kasir-display").textContent="Kasir: "+data.cashier;
  if(data.member)document.getElementById("member-display").textContent="👤 "+data.member;
  else document.getElementById("member-display").textContent="";
}

function renderLiveItems(){
  var el=document.getElementById("items-list");
  if(!liveItems.length){
    el.innerHTML='<div style="text-align:center;padding:60px 0"><p style="color:#78716c;font-size:14px">Menunggu transaksi...</p></div>';
    return;
  }
  var html="";
  liveItems.forEach(function(item,i){
    html+='<div class="item-row slide-in" style="animation-delay:'+i*30+'ms">';
    html+='<div class="item-num">'+(i+1)+'</div>';
    html+='<div class="item-info"><p class="item-name">'+item.name+'</p><p class="item-qty">'+item.qty+' x Rp '+item.price.toLocaleString("id-ID")+'</p></div>';
    html+='<p class="item-price">Rp '+(item.price*item.qty).toLocaleString("id-ID")+'</p>';
    html+='</div>';
  });
  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
}

function handleNewTx(tx){
  isCheckoutDone=true;
  liveItems=(tx.items||[]).map(function(it){return{name:it.name,qty:it.qty,price:it.price}});
  renderLiveItems();
  document.getElementById("grand-total").textContent="Rp "+(tx.grand_total||0).toLocaleString("id-ID");
  
  if(tx.payment==="CASH" && (tx.amount_paid||0)>0){
    document.getElementById("payment-details").style.display="block";
    document.getElementById("cash-paid-display").textContent="Rp "+(tx.amount_paid||0).toLocaleString("id-ID");
    document.getElementById("change-display").textContent="Rp "+(tx.change||0).toLocaleString("id-ID");
  }else{
    document.getElementById("payment-details").style.display="none";
  }

  document.getElementById("payment-info").textContent="✅ "+(tx.payment||"CASH")+" — Selesai";
  document.getElementById("status-text").textContent="Transaksi selesai!";
  document.getElementById("status-text").style.color="#22c55e";
  document.querySelector("#r-status .dot").style.background="#22c55e";
  if(tx.cashier)document.getElementById("kasir-display").textContent="Kasir: "+tx.cashier;
  if(tx.member)document.getElementById("member-display").textContent="👤 "+tx.member;
}

function closeTransaction(){
  isCheckoutDone=false;
  liveItems=[];
  document.getElementById("items-list").innerHTML='<div style="text-align:center;padding:60px 0"><p style="color:#78716c;font-size:14px">Menunggu transaksi...</p></div>';
  document.getElementById("grand-total").textContent="Rp 0";
  document.getElementById("payment-details").style.display="none";
  document.getElementById("payment-info").textContent="";
  document.getElementById("status-text").textContent="Menunggu...";
  document.getElementById("status-text").style.color="#4ade80";
  document.querySelector("#r-status .dot").style.background="#22c55e";
  document.getElementById("kasir-display").textContent="Kasir: --";
  document.getElementById("member-display").textContent="";
}

connectWS();
</script>
</body>
</html>
