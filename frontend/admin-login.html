<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#1d4ed8 100%)}
.card{background:#fff;border-radius:24px;padding:40px;width:380px;box-shadow:0 25px 60px rgba(0,0,0,.3);text-align:center}
.icon{width:64px;height:64px;background:#dc2626;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.icon svg{width:32px;height:32px;color:#fff}
h2{font-size:24px;font-weight:700;margin-bottom:4px}
.sub{color:#64748b;font-size:14px;margin-bottom:24px}
input{width:100%;border:2px solid #e2e8f0;border-radius:12px;padding:12px 16px;font-size:15px;margin-bottom:12px;outline:none;transition:border .2s}
input:focus{border-color:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.1)}
button{width:100%;background:#dc2626;color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;transition:background .2s}
button:hover{background:#b91c1c}
.error{color:#dc2626;font-size:13px;margin-top:12px;display:none}
.back{color:#64748b;font-size:13px;text-decoration:none;display:inline-block;margin-bottom:16px}
.back:hover{color:#1e293b}
</style>
</head>
<body>
<div class="card">
  <a href="/" class="back">← Kembali</a>
  <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></div>
  <h2>Admin Login</h2>
  <p class="sub">Masukkan kredensial admin</p>
  <form onsubmit="doLogin(event)">
    <input id="username" type="text" placeholder="Username" required>
    <input id="password" type="password" placeholder="Password" required>
    <button type="submit">Masuk</button>
  </form>
  <p id="error" class="error"></p>
</div>
<script>
async function doLogin(e){
  e.preventDefault();
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});
  const d=await r.json();
  if(d.status==="ok"&&d.role==="admin"){
    sessionStorage.setItem("token",d.token);
    sessionStorage.setItem("admin","1");
    sessionStorage.setItem("display_name",d.display_name);
    window.location.href="/admin";
  }else{
    document.getElementById("error").textContent=d.message||"Username atau password salah";
    document.getElementById("error").style.display="block";
  }
}
</script>
</body>
</html>
